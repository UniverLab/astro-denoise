[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-denoise-metrics"
version = "0.2.0"
description = "Scientific evaluation metrics for astronomical image denoising"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    "sep>=1.2",
    "photutils>=1.10",
    "scikit-image>=0.22",
    "rich>=13.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
astro-denoise-metrics = "astro_denoise_metrics.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["astro_denoise_metrics*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
