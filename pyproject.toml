[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-denoise-bench"
version = "0.1.0"
description = "Benchmark orchestrator for the astro-denoise ecosystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "astropy>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
astro-denoise-bench = "astro_denoise_bench.__main__:main"

[tool.setuptools.packages.find]
include = ["astro_denoise_bench*"]
