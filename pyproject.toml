[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-denoise-bench"
version = "0.2.0"
description = "Benchmark orchestrator for the astro-denoise ecosystem"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "astropy>=6.0",
    "rich>=13.0",
    "matplotlib>=3.8",
    "textual>=0.80",
    "pyarrow>=15.0",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
astro-denoise-bench = "astro_denoise_bench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["astro_denoise_bench*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
