# CHANGE: astro-denoise-bench (Rust CLI)
id: bench-orquestador-2026
state: active
created_by: gpt-4-openspec
created: 2026-05-19
modules:
  - astro-denoise-bench

motivation: |
  Unificar la orquestación de benchmarks, ejecución y validación de todos los métodos de denoising en el ecosistema, proporcionando recolección automatizada de métricas, descubrimiento plug&play y reproducibilidad total. Implementar en Rust por eficiencia y robustez.

spec:
  summary: |
    CLI principal en Rust capaz de descubrir, invocar y coordinar módulos de denoising (con entry_points), manejar datasets DC2, recolectar todas las métricas y guardar reportes estructurados.
  requirements:
    - Descubrir módulos Python via entry_points/CLI estándar
    - Gestionar datasets/ficheros de entrada y salida (FITS), manejo batch
    - Ejecutar métodos y recolección automatizada de métricas (invocando metrics)
    - Protocolo de reporte estándar (JSON/CSV), reproducible
    - Documentar pipeline y uso
  acceptance:
    - Invoca y mide BM3D, UNet, otros métodos vía CLI/API
    - Compatible con input/output estándar
    - Evidencia end-to-end (pipeline completo corriendo)
    - Documentado con ejemplos y casos de uso
